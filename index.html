<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>아이돌 프로필</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#faf9f7;--card:#fff;--border:#e8e6e2;--text:#2b2a28;--sub:#8a8781;--accent:#c9a876;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard',sans-serif;touch-action:manipulation;}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;max-width:100%;}
body{background:var(--bg);color:var(--text);padding-bottom:60px;overflow-x:hidden;max-width:100%;}
.topbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10;}
.topbar h1{font-size:18px;font-weight:700;}
.btn{background:var(--text);color:#fff;border:none;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;}
.btn.light{background:var(--card);color:var(--text);border:1px solid var(--border);}
.btn.sm{padding:5px 10px;font-size:12px;}
#catBar{display:flex;gap:8px;padding:12px 18px 0;overflow-x:auto;}
.catChip{flex:0 0 auto;padding:6px 12px;border-radius:16px;font-size:12px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap;}
.catChip.active{background:var(--text);color:#fff;border-color:var(--text);}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:18px;}
.cardItem{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;}
.cardItem img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee;}
.cardItem .ph{width:100%;aspect-ratio:3/4;background:#f0efec;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;}
.cardItem .info{padding:10px;}
.cardItem .info .name{font-weight:700;font-size:14px;}
.cardItem .info .aff{color:var(--sub);font-size:12px;margin-top:2px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;justify-content:center;z-index:100;overflow-x:hidden;overflow-y:auto;padding:0 0 40px;}
.overlay.show{display:flex;}
.sheet{background:var(--bg);width:100%;max-width:480px;min-height:100vh;overflow-x:hidden;}
.sheet .head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2;}
.sheet .head h2{font-size:16px;}
.sheet .body{padding:24px 20px 40px;}
.heroImg{width:100%;aspect-ratio:3/4;border-radius:16px;object-fit:cover;background:#eee;}
.dName{font-size:22px;font-weight:800;margin-top:14px;}
.dSub{color:var(--sub);font-size:13px;margin-top:2px;}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.tag{background:#f2efe9;color:var(--accent);border:1px solid var(--accent);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;}
table.info{width:100%;border-collapse:collapse;margin-top:18px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
table.info tr{border-bottom:1px solid var(--border);}
table.info tr:last-child{border-bottom:none;}
table.info th{width:88px;text-align:left;background:#f5f4f1;padding:10px 12px;font-size:13px;color:var(--sub);vertical-align:top;font-weight:600;}
table.info td{padding:10px 12px;font-size:13px;white-space:pre-wrap;line-height:1.5;}
.section{margin-top:20px;}
.section h3{font-size:14px;font-weight:700;margin-bottom:8px;border-left:3px solid var(--accent);padding-left:8px;}
.section p{font-size:13px;line-height:1.6;white-space:pre-wrap;color:#4a4844;}
.photoRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.photoRow img{width:90px;height:90px;object-fit:cover;border-radius:8px;}
.miniCard{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px;margin-top:8px;}
.miniCard img{width:44px;height:44px;object-fit:cover;border-radius:8px;background:#eee;}
.miniCard .mc-name{font-weight:700;font-size:13px;}
.miniCard .mc-sub{color:var(--sub);font-size:12px;}
.detailActions{display:flex;gap:8px;margin-top:20px;}
.field{margin-bottom:14px;min-width:0;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600;}
.field input,.field textarea,.field select{width:100%;max-width:100%;min-width:0;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:16px;background:#fff;color:var(--text);font-family:inherit;box-sizing:border-box;}
.field textarea{resize:vertical;min-height:50px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0;}
.row2 .field{min-width:0;}
.uploadBox{border:1px dashed var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer;color:var(--sub);font-size:13px;}
.uploadBox img{max-width:100%;max-height:200px;border-radius:8px;}
.formSection{margin:32px 0 14px;font-size:13px;font-weight:800;color:var(--accent);}
.empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px;}
.addTile{width:90px;height:90px;border:1px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:22px;cursor:pointer;}
.rowLine{display:flex;gap:6px;align-items:center;margin-top:6px;}
.rowLine select,.rowLine input{flex:1;min-width:0;font-size:14px;padding:7px 8px;border:1px solid var(--border);border-radius:6px;box-sizing:border-box;}
.delX{background:#eee;border:none;border-radius:6px;width:28px;height:28px;font-size:14px;cursor:pointer;flex:0 0 auto;}
.subBox{border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px;}
.ageTag{font-size:12px;color:var(--sub);margin-top:4px;}
.selWrap{display:flex;gap:6px;min-width:0;}
.selWrap select{flex:1;min-width:0;}
</style>
</head>
<body>

<div class="topbar">
  <h1>✨ 프로필 아카이브</h1>
  <button class="btn" onclick="openForm()">+ 추가</button>
</div>
<div id="catBar"></div>
<div id="grid"></div>

<div class="overlay" id="detailOverlay">
  <div class="sheet">
    <div class="head"><span></span><button class="btn light" onclick="closeDetail()">닫기</button></div>
    <div class="body" id="detailBody"></div>
  </div>
</div>

<div class="overlay" id="formOverlay">
  <div class="sheet">
    <div class="head"><h2 id="formTitle">프로필 작성</h2><div style="display:flex;gap:8px"><button class="btn light" onclick="closeForm()">취소</button><button class="btn" onclick="saveProfile()">저장</button></div></div>
    <div class="body" id="formBody">
      <div class="field">
        <label>사진</label>
        <div class="uploadBox" id="uploadBox" onclick="document.getElementById('fileInput').click()">사진을 선택하세요</div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleMainFile(event)">
      </div>

      <div class="formSection">기본 정보</div>
      <div class="field"><label>이름</label><input id="f_name"></div>
      <div class="field"><label>본명</label><input id="f_realname"></div>
      <div class="row2">
        <div class="field"><label>생년월일</label><input type="text" id="f_birth" placeholder="예: 2001-05-12" oninput="updateAgeTag()"><div class="ageTag" id="ageTag"></div></div>
        <div class="field"><label>성별</label>
          <select id="f_gender">
            <option value="">선택</option>
            <option value="남자">남자</option>
            <option value="여자">여자</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field"><label>국적</label><input id="f_nation"></div>
        <div class="field"><label>출생지</label><input id="f_live"></div>
      </div>
      <div class="field"><label>소속</label>
        <div class="selWrap">
          <select id="f_group"></select>
          <button class="btn light sm" onclick="addCategory()">+ 카테고리</button>
        </div>
      </div>
      <div class="field"><label>포지션</label><input id="f_position" placeholder="예: 보컬, 리더, 센터"></div>
      <div class="row2">
        <div class="field"><label>신체 (키/몸무게)</label><input id="f_body" placeholder="예: 173cm, 55kg"></div>
        <div class="field"><label>MBTI</label><input id="f_mbti"></div>
      </div>
      <div class="field"><label>별명</label><input id="f_nick"></div>

      <div class="formSection">학력</div>
      <div id="eduList"></div>
      <button class="btn light sm" style="margin-top:8px" onclick="addEdu()">+ 학력 추가</button>

      <div class="formSection">가족관계</div>
      <div id="familyList"></div>
      <button class="btn light sm" style="margin-top:8px" onclick="addFamily()">+ 가족 추가</button>

      <div class="formSection">외형</div>
      <div class="field"><label>외모</label><textarea id="f_look"></textarea></div>
      <div class="field"><label>착장 (사진)</label>
        <div class="photoRow" id="outfitPhotos"></div>
        <input type="file" id="outfitFile" accept="image/*" style="display:none" onchange="handleArrFile(event,'outfitPhotos')">
      </div>
      <div class="field"><label>착장 (설명)</label><textarea id="f_outfit" placeholder="착장 스타일 설명"></textarea></div>
      <div class="field"><label>신체적 특징</label><textarea id="f_bodyfeat"></textarea></div>

      <div class="formSection">성격 & 특징</div>
      <div class="field"><label>성격/성향</label><textarea id="f_personality"></textarea></div>
      <div class="field"><label>좋아하는 것</label><textarea id="f_like"></textarea></div>
      <div class="field"><label>싫어하는 것</label><textarea id="f_dislike"></textarea></div>
      <div class="field"><label>좌우명</label><input id="f_motto"></div>
      <div class="row2">
        <div class="field"><label>장점</label><textarea id="f_strength"></textarea></div>
        <div class="field"><label>단점</label><textarea id="f_weakness"></textarea></div>
      </div>
      <div class="field"><label>취미</label><textarea id="f_hobby"></textarea></div>
      <div class="field"><label>사소한 TMI</label><textarea id="f_tmi"></textarea></div>
      <div class="field"><label>비밀</label><textarea id="f_secret"></textarea></div>

      <div class="formSection">인간관계</div>
      <div id="relList"></div>
      <button class="btn light sm" style="margin-top:8px" onclick="addRelation()">+ 인물 추가</button>

      <div class="field" style="margin-top:14px"><label>능력 / 특기</label><textarea id="f_ability"></textarea></div>

      <div class="formSection">기타</div>
      <div class="field"><label>어린 시절 (사진)</label>
        <div class="photoRow" id="childPhotos"></div>
        <input type="file" id="childFile" accept="image/*" style="display:none" onchange="handleArrFile(event,'childPhotos')">
      </div>
      <div class="field"><label>왓츠인마이백 (사진)</label>
        <div class="photoRow" id="bagPhotos"></div>
        <input type="file" id="bagFile" accept="image/*" style="display:none" onchange="handleArrFile(event,'bagPhotos')">
      </div>

    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDt6kg-c0Zqjfna2xuryNhUoS87EZn9dP0",
  authDomain: "fanfic-228b7.firebaseapp.com",
  projectId: "fanfic-228b7",
  storageBucket: "fanfic-228b7.firebasestorage.app",
  messagingSenderId: "261204619222",
  appId: "1:261204619222:web:50f74e12ee4b86c8fafe77"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "idolProfiles");

const CLOUDINARY_CLOUD = 'dbljkloal';
const CLOUDINARY_PRESET = 'Everything';

let profiles = [];
let editingId = null;
let activeCat = "전체";
let CATS = JSON.parse(localStorage.getItem('groupCategories')||'["클로우","에이븐","키논","큥파레"]');

// ---- state (form) ----
let state = { image:"", outfitPhotos:[], childPhotos:[], bagPhotos:[], education:[], family:[], relations:[] };
const SIMPLE_FIELDS = ["name","realname","birth","gender","nation","live","position","nick","body","mbti",
"look","outfit","bodyfeat","personality","like","dislike","motto","strength","weakness","hobby","tmi","secret","ability"];

function saveDraft(){
  SIMPLE_FIELDS.forEach(f=>state[f]=document.getElementById('f_'+f).value);
  state.group = document.getElementById('f_group').value;
  localStorage.setItem('draft', JSON.stringify(state));
  localStorage.setItem('draftMeta', JSON.stringify({open:true, editingId}));
}
document.getElementById('formBody').addEventListener('input', saveDraft);
document.getElementById('formBody').addEventListener('change', saveDraft);

function renderCatOptions(){
  const sel = document.getElementById('f_group');
  sel.innerHTML = CATS.map(c=>`<option value="${c}">${c}</option>`).join('');
}
window.addCategory = function(){
  const name = prompt("새 카테고리 이름");
  if(!name) return;
  if(!CATS.includes(name)) CATS.push(name);
  localStorage.setItem('groupCategories', JSON.stringify(CATS));
  renderCatOptions();
  document.getElementById('f_group').value = name;
  renderCatBar();
  saveDraft();
}

function renderCatBar(){
  const bar = document.getElementById('catBar');
  const all = ["전체", ...CATS];
  bar.innerHTML = all.map(c=>`<div class="catChip ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</div>`).join('');
}
window.setCat = function(c){ activeCat = c; renderCatBar(); renderGrid(); }

window.updateAgeTag = function(){
  const v = document.getElementById('f_birth').value;
  const tag = document.getElementById('ageTag');
  const age = calcAge(v);
  tag.innerText = age || "";
}

// ---- photo arrays ----
async function uploadToCloudinary(file){
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLOUDINARY_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {method:'POST', body:fd});
  const data = await res.json();
  return data.secure_url;
}
window.handleMainFile = async function(e){
  const file = e.target.files[0]; if(!file) return;
  document.getElementById('uploadBox').innerText = "업로드 중...";
  state.image = await uploadToCloudinary(file);
  document.getElementById('uploadBox').innerHTML = `<img src="${state.image}">`;
  saveDraft();
}
window.handleArrFile = async function(e, key){
  const file = e.target.files[0]; if(!file) return;
  const url = await uploadToCloudinary(file);
  state[key].push(url);
  renderPhotoRow(key);
  saveDraft();
  e.target.value = "";
}
function renderPhotoRow(key){
  const box = document.getElementById(key);
  const inputMap = {outfitPhotos:'outfitFile', childPhotos:'childFile', bagPhotos:'bagFile'};
  box.innerHTML = state[key].map((u,i)=>`<div style="position:relative"><img src="${u}"><button class="delX" style="position:absolute;top:-6px;right:-6px" onclick="removePhoto('${key}',${i})">×</button></div>`).join('')
    + `<div class="addTile" onclick="document.getElementById('${inputMap[key]}').click()">+</div>`;
}
window.removePhoto = function(key, i){ state[key].splice(i,1); renderPhotoRow(key); saveDraft(); }

// ---- education (draft: only committed on 저장) ----
window.eduDraft = null;
window.addEdu = function(){ window.eduDraft = {index:-1, data:{level:"초등학교", school:"", period:""}}; renderEdu(); }
window.editEdu = function(i){ window.eduDraft = {index:i, data:Object.assign({},state.education[i])}; renderEdu(); }
window.cancelEdu = function(){ window.eduDraft = null; renderEdu(); }
window.saveEdu = function(){
  if(!window.eduDraft) return;
  if(window.eduDraft.index===-1) state.education.push(window.eduDraft.data);
  else state.education[window.eduDraft.index] = window.eduDraft.data;
  window.eduDraft = null; renderEdu(); saveDraft();
}
window.removeEdu = function(i){ state.education.splice(i,1); renderEdu(); saveDraft(); }
function renderEdu(){
  const box = document.getElementById('eduList');
  let html = state.education.map((ed,i)=>`
    <div class="subBox">
      <div>· [${ed.level}] ${ed.school} ${ed.period?('('+ed.period+')'):''}</div>
      <div class="rowLine">
        <button class="btn light sm" onclick="editEdu(${i})">수정</button>
        <button class="btn light sm" onclick="removeEdu(${i})">삭제</button>
      </div>
    </div>`).join('');
  if(window.eduDraft){
    const ed = window.eduDraft.data;
    html += `
    <div class="subBox">
      <div class="rowLine">
        <select onchange="window.eduDraft.data.level=this.value">
          ${["초등학교","중학교","고등학교","대학교","기타"].map(l=>`<option ${ed.level===l?'selected':''}>${l}</option>`).join('')}
        </select>
        <input placeholder="학교명" value="${ed.school}" oninput="window.eduDraft.data.school=this.value">
        <input placeholder="기간(예:전학)" value="${ed.period}" oninput="window.eduDraft.data.period=this.value">
      </div>
      <div class="rowLine">
        <button class="btn sm" onclick="saveEdu()">저장</button>
        <button class="btn light sm" onclick="cancelEdu()">취소</button>
      </div>
    </div>`;
  }
  box.innerHTML = html;
}

// ---- family (draft: only committed on 저장) ----
window.famDraft = null;
window.addFamily = function(){ window.famDraft = {index:-1, data:{relation:"", name:"", photo:""}}; renderFamily(); }
window.editFamily = function(i){ window.famDraft = {index:i, data:Object.assign({},state.family[i])}; renderFamily(); }
window.cancelFamily = function(){ window.famDraft = null; renderFamily(); }
window.saveFamily = function(){
  if(!window.famDraft) return;
  if(window.famDraft.index===-1) state.family.push(window.famDraft.data);
  else state.family[window.famDraft.index] = window.famDraft.data;
  window.famDraft = null; renderFamily(); saveDraft();
}
window.removeFamily = function(i){ state.family.splice(i,1); renderFamily(); saveDraft(); }
window.familyFileUpload = async function(e){
  const file = e.target.files[0]; if(!file || !window.famDraft) return;
  window.famDraft.data.photo = await uploadToCloudinary(file);
  renderFamily();
}
function renderFamily(){
  const box = document.getElementById('familyList');
  let html = state.family.map((f,i)=>`
    <div class="miniCard">
      ${f.photo?`<img src="${f.photo}">`:'<div style="width:44px;height:44px;background:#eee;border-radius:8px"></div>'}
      <div style="flex:1"><div class="mc-name">${f.name||''}</div><div class="mc-sub">${f.relation||''}</div></div>
      <button class="btn light sm" onclick="editFamily(${i})">수정</button>
      <button class="btn light sm" onclick="removeFamily(${i})">삭제</button>
    </div>`).join('');
  if(window.famDraft){
    const f = window.famDraft.data;
    html += `
    <div class="subBox">
      <div class="rowLine">
        <input placeholder="관계(예:엄마)" value="${f.relation}" oninput="window.famDraft.data.relation=this.value">
        <input placeholder="이름" value="${f.name}" oninput="window.famDraft.data.name=this.value">
      </div>
      <div class="photoRow" style="margin-top:6px">
        ${f.photo ? `<img src="${f.photo}" style="width:60px;height:60px;object-fit:cover;border-radius:8px">` : ''}
        <div class="addTile" style="width:60px;height:60px" onclick="this.nextElementSibling.click()">+</div>
        <input type="file" accept="image/*" style="display:none" onchange="familyFileUpload(event)">
      </div>
      <div class="rowLine">
        <button class="btn sm" onclick="saveFamily()">저장</button>
        <button class="btn light sm" onclick="cancelFamily()">취소</button>
      </div>
    </div>`;
  }
  box.innerHTML = html;
}

// ---- relations (draft: only committed on 저장) ----
window.relDraft = null;
window.addRelation = function(){ window.relDraft = {index:-1, data:{id:"", text:""}}; renderRelations(); }
window.editRelation = function(i){ window.relDraft = {index:i, data:Object.assign({},state.relations[i])}; renderRelations(); }
window.cancelRelation = function(){ window.relDraft = null; renderRelations(); }
window.saveRelation = function(){
  if(!window.relDraft) return;
  if(window.relDraft.index===-1) state.relations.push(window.relDraft.data);
  else state.relations[window.relDraft.index] = window.relDraft.data;
  window.relDraft = null; renderRelations(); saveDraft();
}
window.removeRelation = function(i){ state.relations.splice(i,1); renderRelations(); saveDraft(); }
function renderRelations(){
  const box = document.getElementById('relList');
  const others = profiles.filter(p=>p.id!==editingId);
  let html = state.relations.map((r,i)=>{
    const other = others.find(o=>o.id===r.id);
    return `<div class="miniCard">
      ${other&&other.image?`<img src="${other.image}">`:'<div style="width:44px;height:44px;background:#eee;border-radius:8px"></div>'}
      <div style="flex:1"><div class="mc-name">${other?other.name:'(미선택)'}</div><div class="mc-sub">${r.text||''}</div></div>
      <button class="btn light sm" onclick="editRelation(${i})">수정</button>
      <button class="btn light sm" onclick="removeRelation(${i})">삭제</button>
    </div>`;
  }).join('');
  if(window.relDraft){
    const r = window.relDraft.data;
    html += `
    <div class="subBox">
      <div class="rowLine">
        <select onchange="window.relDraft.data.id=this.value">
          <option value="">-- 인물 선택 --</option>
          ${others.map(o=>`<option value="${o.id}" ${r.id===o.id?'selected':''}>${o.name}</option>`).join('')}
        </select>
      </div>
      <textarea placeholder="관계 설명" oninput="window.relDraft.data.text=this.value">${r.text}</textarea>
      <div class="rowLine">
        <button class="btn sm" onclick="saveRelation()">저장</button>
        <button class="btn light sm" onclick="cancelRelation()">취소</button>
      </div>
    </div>`;
  }
  box.innerHTML = html;
}

// ---- form open/close ----
window.openForm = function(id){
  editingId = id || null;
  window.eduDraft = null; window.famDraft = null; window.relDraft = null;
  state = { image:"", outfitPhotos:[], childPhotos:[], bagPhotos:[], education:[], family:[], relations:[] };
  SIMPLE_FIELDS.forEach(f=>document.getElementById('f_'+f).value = "");
  document.getElementById('uploadBox').innerHTML = "사진을 선택하세요";
  document.getElementById('formTitle').innerText = id ? "프로필 수정" : "프로필 작성";
  if(id){
    const p = profiles.find(x=>x.id===id);
    if(p){
      SIMPLE_FIELDS.forEach(f=>document.getElementById('f_'+f).value = p[f]||"");
      document.getElementById('f_group').value = p.group || CATS[0];
      state.image = p.image||"";
      state.outfitPhotos = p.outfitPhotos||[];
      state.childPhotos = p.childPhotos||[];
      state.bagPhotos = p.bagPhotos||[];
      state.education = p.education||[];
      state.family = p.family||[];
      state.relations = p.relations||[];
      if(state.image) document.getElementById('uploadBox').innerHTML = `<img src="${state.image}">`;
      updateAgeTag();
    }
  }
  renderPhotoRow('outfitPhotos'); renderPhotoRow('childPhotos'); renderPhotoRow('bagPhotos');
  renderEdu(); renderFamily(); renderRelations();
  document.getElementById('formOverlay').classList.add('show');
  saveDraft();
}
window.closeForm = function(){
  document.getElementById('formOverlay').classList.remove('show');
  localStorage.removeItem('draft'); localStorage.removeItem('draftMeta');
}

window.saveProfile = async function(){
  const obj = { image: state.image, outfitPhotos: state.outfitPhotos, childPhotos: state.childPhotos,
    bagPhotos: state.bagPhotos, education: state.education, family: state.family, relations: state.relations,
    group: document.getElementById('f_group').value };
  SIMPLE_FIELDS.forEach(f=>obj[f]=document.getElementById('f_'+f).value);
  if(!obj.name){ alert("이름을 입력해주세요"); return; }
  if(editingId){ await updateDoc(doc(db,"idolProfiles",editingId), obj); }
  else{ await addDoc(colRef, obj); }
  localStorage.removeItem('draft'); localStorage.removeItem('draftMeta');
  document.getElementById('formOverlay').classList.remove('show');
  loadProfiles();
}

window.deleteProfile = async function(id){
  if(!confirm("삭제하시겠습니까?")) return;
  await deleteDoc(doc(db,"idolProfiles",id));
  closeDetail();
  loadProfiles();
}
window.closeDetail = function(){ document.getElementById('detailOverlay').classList.remove('show'); }

function calcAge(birth){
  if(!birth) return "";
  const b = new Date(birth.replace(/[.\s]+/g,'-').replace(/-+$/,'')); const t = new Date();
  if(isNaN(b.getTime())) return "";
  let age = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if(m < 0 || (m===0 && t.getDate() < b.getDate())) age--;
  return "만 "+age+"세";
}

window.openDetail = function(id){
  const p = profiles.find(x=>x.id===id);
  if(!p) return;
  const rows = [
    ["본명", p.realname],["생년월일", p.birth ? (p.birth+(calcAge(p.birth)?(" ("+calcAge(p.birth)+")"):"")) : ""],
    ["성별", p.gender],["국적", p.nation],["출생지", p.live],["신체", p.body],["MBTI", p.mbti]
  ].filter(r=>r[1]);

  const eduHtml = (p.education&&p.education.length) ? p.education.map(ed=>`<div>· [${ed.level}] ${ed.school} ${ed.period?('('+ed.period+')'):''}</div>`).join('') : "";
  const famHtml = (p.family&&p.family.length) ? p.family.map(f=>`<div class="miniCard">${f.photo?`<img src="${f.photo}">`:'<div style="width:44px;height:44px;background:#eee;border-radius:8px"></div>'}<div><div class="mc-name">${f.name||''}</div><div class="mc-sub">${f.relation||''}</div></div></div>`).join('') : "";
  const relHtml = (p.relations&&p.relations.length) ? p.relations.map(r=>{
    const other = profiles.find(o=>o.id===r.id);
    return `<div class="miniCard">${other&&other.image?`<img src="${other.image}">`:'<div style="width:44px;height:44px;background:#eee;border-radius:8px"></div>'}<div><div class="mc-name">${other?other.name:'(삭제된 인물)'}</div><div class="mc-sub">${r.text||''}</div></div></div>`;
  }).join('') : "";

  const sections = [
    ["외모", p.look],["신체적 특징", p.bodyfeat],
    ["성격/성향", p.personality],["좋아하는 것", p.like],["싫어하는 것", p.dislike],["좌우명", p.motto],
    ["장점", p.strength],["단점", p.weakness],["취미", p.hobby],["사소한 TMI", p.tmi],["비밀", p.secret],
    ["능력/특기", p.ability]
  ].filter(s=>s[1]);

  function photoSection(title, arr){
    if(!arr || !arr.length) return "";
    return `<div class="section"><h3>${title}</h3><div class="photoRow">${arr.map(u=>`<img src="${u}">`).join('')}</div></div>`;
  }

  document.getElementById('detailBody').innerHTML = `
    ${p.image ? `<img class="heroImg" src="${p.image}">` : ''}
    <div class="dName">${p.name}</div>
    <div class="dSub">${p.group||''} ${p.position?(' · '+p.position):''}</div>
    ${rows.length?`<table class="info">${rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table>`:''}
    ${eduHtml?`<div class="section"><h3>학력</h3><p>${eduHtml}</p></div>`:''}
    ${famHtml?`<div class="section"><h3>가족관계</h3>${famHtml}</div>`:''}
    ${photoSection('착장', p.outfitPhotos)}
    ${p.outfit?`<div class="section"><h3>착장 (설명)</h3><p>${p.outfit}</p></div>`:''}
    ${sections.map(s=>`<div class="section"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}
    ${relHtml?`<div class="section"><h3>인간관계</h3>${relHtml}</div>`:''}
    ${photoSection('어린 시절', p.childhoodPhotos||p.childPhotos)}
    ${photoSection('왓츠인마이백', p.bagPhotos)}
    <div class="detailActions">
      <button class="btn" onclick="openForm('${id}')">수정</button>
      <button class="btn light" onclick="deleteProfile('${id}')">삭제</button>
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('show');
}

window.loadProfiles = async function(){
  const snap = await getDocs(colRef);
  profiles = [];
  snap.forEach(d=>profiles.push({id:d.id, ...d.data()}));
  renderGrid();
}
function renderGrid(){
  const grid = document.getElementById('grid');
  const list = activeCat==="전체" ? profiles : profiles.filter(p=>p.group===activeCat);
  if(list.length===0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">등록된 프로필이 없습니다.</div>`;
    return;
  }
  grid.innerHTML = list.map(p=>`
    <div class="cardItem" onclick="openDetail('${p.id}')">
      ${p.image ? `<img src="${p.image}">` : `<div class="ph">No Image</div>`}
      <div class="info"><div class="name">${p.name}</div><div class="aff">${p.group||''}${p.position?(' · '+p.position):''}</div></div>
    </div>`).join('');
}

// init
renderCatOptions();
renderCatBar();
loadProfiles().then(()=>{
  const meta = JSON.parse(localStorage.getItem('draftMeta')||'null');
  if(meta && meta.open){
    const draft = JSON.parse(localStorage.getItem('draft')||'null');
    openForm(meta.editingId);
    if(draft){
      state = Object.assign(state, draft);
      SIMPLE_FIELDS.forEach(f=>{ if(draft[f]!==undefined) document.getElementById('f_'+f).value = draft[f]; });
      if(draft.group) document.getElementById('f_group').value = draft.group;
      if(state.image) document.getElementById('uploadBox').innerHTML = `<img src="${state.image}">`;
      renderPhotoRow('outfitPhotos'); renderPhotoRow('childPhotos'); renderPhotoRow('bagPhotos');
      renderEdu(); renderFamily(); renderRelations();
      updateAgeTag();
    }
  }
});
